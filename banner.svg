<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1E38" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#818CF8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="15" fill="url(#bg-grad)" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Decorative Grid / Lines -->
  <path d="M 0,40 L 800,40 M 0,80 L 800,80 M 0,120 L 800,120 M 0,160 L 800,160" stroke="#1F2937" stroke-width="0.5" opacity="0.3"/>
  <path d="M 160,0 L 160,200 M 320,0 L 320,200 M 480,0 L 480,200 M 640,0 L 640,200" stroke="#1F2937" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Sleek Accent Lines -->
  <rect x="0" y="0" width="800" height="6" rx="3" fill="url(#accent-grad)"/>

  <!-- Name -->
  <text x="50%" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4" fill="url(#text-grad)" filter="url(#glow)">
    HESLER ZACASA GARCIA
  </text>

  <!-- Subtitle -->
  <text x="50%" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#9CA3AF">
    SOFTWARE ENGINEER • SERVICENOW CONSULTANT
  </text>
  
  <!-- Additional decoration (tech-like dots) -->
  <circle cx="50" cy="170" r="3" fill="#3B82F6" opacity="0.6"/>
  <circle cx="70" cy="170" r="3" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="90" cy="170" r="3" fill="#EC4899" opacity="0.6"/>
  
  <circle cx="750" cy="170" r="3" fill="#3B82F6" opacity="0.6"/>
  <circle cx="730" cy="170" r="3" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="710" cy="170" r="3" fill="#EC4899" opacity="0.6"/>
</svg>
